services:
  runtime-adapter:
    build:
      context: .
      dockerfile: services/runtime-adapter/Dockerfile.acp-0.2.0-rc.2-candidate
    environment:
      BYQ_DSH_COMPATIBILITY_RELEASE: dsh-v0.2.0-rc.2-acp
      BYQ_DSH_PROCESS_OWNERSHIP: root-turn
      BYQ_DSH_RUNTIME_ROOT: /opt/dsh-runtime
      BYQ_DSH_COMPOSITION: /opt/byq/profiles/byq-product.patch.yml
      BYQ_DSH_COMPOSITION_IDENTITY: /opt/byq/profiles/byq-product.identity.json
      BYQ_DSH_RELEASE_IDENTITY: /opt/byq/releases/deployment.identity.json
      DSH_SESSION_ROOT: /var/lib/byq/dsh-sessions/dsh-v0.2.0-rc.2-acp
      BYQ_MCP_ACP_DISCOVERY_TOKEN: ${BYQ_MCP_ACP_DISCOVERY_TOKEN:?BYQ_MCP_ACP_DISCOVERY_TOKEN must be set for ACP}
      BYQ_MCP_ACP_SIGNING_KEY: ${BYQ_MCP_ACP_SIGNING_KEY:?BYQ_MCP_ACP_SIGNING_KEY must be set for ACP}

  mcp:
    environment:
      BYQ_MCP_ACP_DISCOVERY_TOKEN: ${BYQ_MCP_ACP_DISCOVERY_TOKEN:?BYQ_MCP_ACP_DISCOVERY_TOKEN must be set for ACP}
      BYQ_MCP_ACP_SIGNING_KEY: ${BYQ_MCP_ACP_SIGNING_KEY:?BYQ_MCP_ACP_SIGNING_KEY must be set for ACP}
      BYQ_MCP_BACKEND_PROOF_TOKEN: ${BYQ_MCP_BACKEND_PROOF_TOKEN:?BYQ_MCP_BACKEND_PROOF_TOKEN must be set for ACP}

  backend:
    environment:
      BYQ_MCP_BACKEND_PROOF_TOKEN: ${BYQ_MCP_BACKEND_PROOF_TOKEN:?BYQ_MCP_BACKEND_PROOF_TOKEN must be set for ACP}
