# Qualification-only second static Product slot. Never include this overlay in
# the development, release, or CI Compose file lists.
services:
  runtime-adapter:
    environment:
      BYQ_ACP_PRODUCT_SLOT_BINDINGS: >-
        {"${BYQ_ACP_PRODUCT_WORKSPACE_ID:?primary workspace is required}":{"socket_path":"/run/byq-acp-product-runner/control.sock","control_secret_env":"BYQ_ACP_PRODUCT_SLOT_PRIMARY_SECRET"},"${BYQ_QUAL_ACP_PRODUCT_SECONDARY_WORKSPACE_ID:?secondary workspace is required}":{"socket_path":"/run/byq-acp-product-runner-secondary/control.sock","control_secret_env":"BYQ_ACP_PRODUCT_SLOT_SECONDARY_SECRET"}}
      BYQ_ACP_PRODUCT_SLOT_SECONDARY_SECRET: ${BYQ_QUAL_ACP_PRODUCT_SECONDARY_SECRET:?secondary runner secret is required}
    volumes:
      - byq_acp_two_user_qualification_secondary_sessions:${BYQ_DSH_BUILD_SESSION_ROOT:?ACP session root is required}/${BYQ_QUAL_ACP_PRODUCT_SECONDARY_WORKSPACE_ID:?secondary workspace is required}
      - byq_acp_two_user_qualification_secondary_control:/run/byq-acp-product-runner-secondary
    depends_on:
      acp-product-runner-secondary:
        condition: service_healthy

  acp-product-runner-secondary:
    image: ${COMPOSE_PROJECT_NAME:-beyondquant}-acp-unified
    user: "0:0"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BYQ_ACP_ROLE: product
      BYQ_DSH_PROCESS_OWNERSHIP: workspace-slot
      BYQ_DSH_COMPOSITION: /opt/byq/profiles/byq-product.patch.yml
      BYQ_DSH_COMPOSITION_IDENTITY: /opt/byq/profiles/byq-product.identity.json
      BYQ_DSH_RELEASE_IDENTITY: /opt/byq/releases/deployment.identity.json
      DSH_MAX_TOKENS_AS_SUCCESS: "false"
      BYQ_ACP_PRODUCT_WORKSPACE_ID: ${BYQ_QUAL_ACP_PRODUCT_SECONDARY_WORKSPACE_ID:?secondary workspace is required}
      BYQ_ACP_PRODUCT_RUNNER_CONTROL_SECRET: ${BYQ_QUAL_ACP_PRODUCT_SECONDARY_SECRET:?secondary runner secret is required}
    volumes:
      - byq_acp_two_user_qualification_secondary_sessions:${BYQ_DSH_BUILD_SESSION_ROOT:?ACP session root is required}/${BYQ_QUAL_ACP_PRODUCT_SECONDARY_WORKSPACE_ID:?secondary workspace is required}
      - byq_acp_two_user_qualification_secondary_state:/var/lib/byq/acp-product-runner-state
      - byq_acp_two_user_qualification_secondary_control:/run/byq-acp-product-runner
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    networks: [byq_product]
    healthcheck:
      test: [CMD, python3, -c, "import os; from pathlib import Path; p=Path('/run/byq-acp-product-runner/ready'); raise SystemExit(0 if p.is_file() and p.read_text()==os.environ['BYQ_ACP_PRODUCT_WORKSPACE_ID']+'\\n' else 1)"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

volumes:
  byq_acp_two_user_qualification_secondary_sessions:
    name: ${COMPOSE_PROJECT_NAME:-beyondquant}-acp-two-user-qualification-secondary-sessions
  byq_acp_two_user_qualification_secondary_state:
    name: ${COMPOSE_PROJECT_NAME:-beyondquant}-acp-two-user-qualification-secondary-state
  byq_acp_two_user_qualification_secondary_control:
    name: ${COMPOSE_PROJECT_NAME:-beyondquant}-acp-two-user-qualification-secondary-control
