[extend]
useDefault = true

[allowlist]
description = "Synthetic, non-secret fixtures used by tests and evidence scripts."
paths = [
  '''apps/frontend/src/api/credentialSubmission\.spec\.ts''',
  '''scripts/evidence/h4-strategy-pagination-fixture\.py''',
  '''services/backend/tests/test_credential_receipts\.py''',
  '''scripts/d15/runtime_continuity/compose\.runtime-qual\.yml''',
  '''docs/evidence/d15/d15-runtime/.*\.json''',
]

# Exact mocked OptimizationJob idempotency key; every other value stays scanned.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact mocked OptimizationJob idempotency key in Gateway tests"
condition = "AND"
paths = ['''^services/gateway/tests/test_product_api\.py$''']
regexTarget = "secret"
regexes = ['''^optimization-key-1$''']

# Source identity digests in five fixed ACP evidence JSON files are SHA-256
# readbacks, not credentials. Both the exact path and 64-hex shape must match.
[[rules.allowlists]]
description = "Exact ACP source hash readback evidence"
condition = "AND"
paths = [
  '''^docs/evidence/dsh-acp-single-version/runtime-single-version-retirement-20261009/source-hashes\.json$''',
  '''^docs/evidence/dsh-acp-single-version/runtime-single-version-retirement-20261009/independent-runtime-focused-summary\.json$''',
  '''^docs/evidence/dsh-acp-single-version/adr0109-revision-20261009/image-source-readback\.json$''',
  '''^docs/evidence/dsh-acp-single-version/acp-current-real-archive-20261010/artifacts/proof-before-cleanup\.json$''',
  '''^docs/evidence/dsh-acp-single-version/acp-current-real-archive-20261010/artifacts/result\.json$''',
]
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
# One exact historical evidence line; path and full line must both match.
[[rules.allowlists]]
description = "Exact execution options scope note"
condition = "AND"
paths = ['''^docs/evidence/dsh-acp-maintenance-20261013/ROOT-EXECUTION-OPTIONS-STORAGE-PASS\.json$''']
regexTarget = "line"
regexes = ['''^\n?  "scope": "Conversation-owned optional execution settings, persistence, CAS, Product API, disabled/foreign identity and workspace-reset archive behavior",$''']

# One exact historical evidence line; path and full line must both match.
[[rules.allowlists]]
description = "Exact lease observer digest readback"
condition = "AND"
paths = ['''^docs/evidence/dsh-acp-maintenance-20261013/ROOT-LEASE-OBSERVER-OFFLINE-FAIL-STOP\.json$''']
regexTarget = "line"
regexes = ['''^\n?    "services/gateway/tests/test_product_api\.py": "82b636da09e52ba72983bbdc44d937e3865044fc4dd04365df611c541ad00234"$''']

# One exact historical evidence line; path and full line must both match.
[[rules.allowlists]]
description = "Exact manual browser digest readback one"
condition = "AND"
paths = ['''^docs/evidence/dsh-acp-maintenance-20261013/ROOT-MANUAL-BROWSER-ONE-TURN-PASS\.json$''']
regexTarget = "line"
regexes = ['''^\n?    "gateway-postcheck-old-auth-failure\.json": "2df07a4bdbfcbb04004d466c8af53778c9e5d647fd90a32ad4fec6ec8e696717",$''']

# One exact historical evidence line; path and full line must both match.
[[rules.allowlists]]
description = "Exact manual browser digest readback two"
condition = "AND"
paths = ['''^docs/evidence/dsh-acp-maintenance-20261013/ROOT-MANUAL-BROWSER-ONE-TURN-PASS\.json$''']
regexTarget = "line"
regexes = ['''^\n?    "postcheck-auth-refresh\.json": "2a8e4d238b9f42c1fd6afcac840ccdb6cbb9837f94cf33eb4166ea98e4891ad9"$''']
