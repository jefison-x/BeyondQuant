# Diagnostic-only Phase 5 DSH Web profile. It is not part of the product
# request path; use the JSON-RPC Runtime Adapter in the base compose.
services:
  dsh:
    profiles: ["dsh-web"]
    build:
      context: .
      dockerfile: services/dsh/Dockerfile
    environment:
      BYQ_MCP_TOKEN: ${BYQ_MCP_TOKEN:?BYQ_MCP_TOKEN must be set}
      DSH_HOME: /opt/dsh
      DSH_TELEMETRY_DISABLED: "true"
    networks:
      - byq_product
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3080/').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
