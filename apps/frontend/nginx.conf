# Compose user-defined networks provide Docker's embedded DNS.
# Shared upstream state follows Gateway address changes without reloading Nginx.
upstream byq_gateway {
    zone byq_gateway 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server gateway:8100 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Never replay an uncertain request through another upstream address.
    proxy_next_upstream off;

    location = /readyz {
        proxy_pass http://byq_gateway;
        proxy_set_header Host gateway:8100;
    }

    location /api/ {
        proxy_pass http://byq_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/workflows/ {
        proxy_pass http://byq_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /v1/ {
        proxy_pass http://byq_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
