# Local debugging override only. This is not a production deployment config.
services:
  gateway:
    ports: !override
      - "${BYQ_GATEWAY_BIND:-127.0.0.1:0}:8100"
  mcp:
    ports:
      - "${BYQ_DEV_MCP_BIND:-127.0.0.1:0}:8300"
  backend:
    ports:
      - "${BYQ_DEV_BACKEND_BIND:-127.0.0.1:0}:8000"
  workspace-reset-gc:
    profiles: ["maintenance"]
    image: ${BYQ_DEV_SCOPE:?BYQ_DEV_SCOPE is required}-backend
    entrypoint: ["python", "-m"]
    command: ["app.workspace_reset_gc"]
    restart: "no"
    environment:
      BYQ_DEV_SCOPE: ${BYQ_DEV_SCOPE:?BYQ_DEV_SCOPE is required}
      COMPOSE_PROJECT_NAME: ${BYQ_DEV_SCOPE:?BYQ_DEV_SCOPE is required}
      BYQ_DATABASE_URL: ${BYQ_DATABASE_URL:-postgresql+psycopg://byq_app:byq-app-dev@postgres:5432/byq_domain}
      BYQ_BACKTEST_OBJECT_ROOT: /var/lib/byq/domain/backtest-objects
      BYQ_ML_OBJECT_ROOT: /var/lib/byq/ml-objects
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - byq_product
    volumes:
      - byq_domain_state:/var/lib/byq/domain
      - byq_ml_model_state:/var/lib/byq/ml-objects
  runtime-adapter:
    build:
      dockerfile: services/runtime-adapter/Dockerfile.post-u8-277-candidate
    ports:
      - "${BYQ_DEV_ADAPTER_BIND:-127.0.0.1:0}:8400"
