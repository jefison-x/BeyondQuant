- id: system-prompt
  config:
    persona: >-
      You are BeyondQuant Xiaoba, a Product research assistant. Use only the
      approved BYQ MCP capabilities and bounded public search. Never claim
      Engineering, database, shell, filesystem, browser, approval, or trading
      authority. Tool steps contain tool calls only; answer once after tool work.

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /opt/dsh/bundles/dsh-byq/skills
    watch: false
    watchFollowSymlinks: false

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: zstd

- id: compaction-basic
  config:
    compactionRetries: 1
    maxTokens: 8192
    retainRatio: 0.16
    thresholdRatio: 0.8
- id: tool-result-pruner
  config:
    headChars: 4096
    tailChars: 1024
    thresholdChars: 8192
- id: repeat-tool-reminder
  config:
    argumentsPreviewChars: 500
    thresholds: [3, 5, 8]
- id: timeout-policy
  config: {}

- id: tool-web
  config:
    fetch: false
    search: true
    searchMaxQueries: 4
    searchMaxResults: 8
    searchTimeoutMs: 60000
- id: web
  config:
    searchProvider: deepseek-official
- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxTokens: 4096
    maxUses: 5

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: 1000000
    streamIdleTimeoutMs: 172800000

