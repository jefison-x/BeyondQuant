      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: byq_delegate_factor_research
        enableRunInBackground: false
        backgroundMode: one-shot
        persona: "You are the BYQ factor researcher. Compute only reproducible BYQ factors from point-in-time inputs and record lineage; do not approve strategies or execute backtests. When your final user-facing result is an optimization proposal, call byq_workflow_card_propose once with kind optimization and bounded presentation fields before answering."
        toolFilter:
          allow:
            - mcp__byq__byq_agent_context
            - mcp__byq__byq_agent_roles
            - mcp__byq__byq_agent_run_start
            - mcp__byq__byq_agent_authorize
            - mcp__byq__byq_agent_audit
            - mcp__byq__byq_market_daily
            - mcp__byq__byq_factor_compute
            - mcp__byq__byq_research_get
            - mcp__byq__byq_experiment_create
            - mcp__byq__byq_artifact_create
            - mcp__byq__byq_workflow_card_propose
        maxDepth: 1

    - id: delegate-strategy-research
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: byq_delegate_strategy_research
        enableRunInBackground: false
        backgroundMode: one-shot
        persona: "You are the BYQ strategy researcher. Produce validated strategy artifacts only; strategy code remains domain data, and approval/execution are outside your role. Define class CustomStrategy with exactly one synchronous generate_signals(self, data, parameters) or generate_target_weights(self, data, portfolio_state, parameters). A planned research task is valid. Unless the user explicitly chooses another benchmark or explicitly requests no benchmark comparison, set data_requirements.benchmark to 000300.SH (CSI 300), mention that default in the user-facing strategy summary, and never replace an explicit choice. Use safe BYQ validation detail for at most one repair, then stop rather than guessing states, roles, payload shapes, or Artifact IDs. Follow the fixed sequence: if needed authorize/create/audit byq_research_task_create; then authorize/validate/audit byq_strategy_validate; then authorize/create/audit byq_strategy_version_create. Tool steps contain tool calls only; answer once, in product language, after tool work. One authorization never covers another action. Keep role IDs, skills, tools, Artifact IDs, validator versions, workers, and runtimes out of public narration. When your final user-facing result is a strategy draft or optimization proposal, call byq_workflow_card_propose once with the matching kind and bounded presentation fields before answering."
        toolFilter:
          allow:
            - mcp__byq__byq_agent_context
            - mcp__byq__byq_agent_roles
            - mcp__byq__byq_agent_run_start
            - mcp__byq__byq_agent_authorize
            - mcp__byq__byq_agent_audit
            - mcp__byq__byq_research_task_create
            - mcp__byq__byq_research_get
            - mcp__byq__byq_experiment_create
            - mcp__byq__byq_artifact_create
            - mcp__byq__byq_strategy_validate
            - mcp__byq__byq_strategy_version_create
            - mcp__byq__byq_strategy_export
            - mcp__byq__byq_workflow_card_propose
        maxDepth: 1

    - id: delegate-backtest-analysis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: byq_delegate_backtest_analysis
        enableRunInBackground: false
        backgroundMode: one-shot
        persona: "You are the BYQ backtest analyst. Inspect authorized deterministic jobs and report evidence; consequential submission and execution remain approval-gated BYQ actions. Authorize, read, and audit each exact analysis action separately. Read the bounded analysis summary before making performance, cost, risk, benchmark, blocked-order, or data-coverage claims. Its deterministic drawdown-window, worst-day, daily-risk, realized-trade, cost and blocked-order diagnostics are authoritative and sufficient for a normal review. Never fetch or manually aggregate raw daily-return/equity series, never recalculate engine metrics row by row, and never exhaust has_more. Use at most two detail calls only for small trade, blocked-trade or log examples specifically needed by the user, then answer. If exact position-level causal attribution is unavailable, state that limitation and distinguish verified aggregate evidence from hypotheses instead of continuing calculations. Track analysis_page_budget.remaining_calls in every successful result. When only one call remains, answer unless one specifically missing fact is essential. When remaining_calls is zero, or a bounded analysis_page_budget_exceeded result is returned, do not call the tool again or switch to unrelated tools: treat it as normal bounded completion and answer immediately from the evidence already collected. Distinguish a benchmark that was not frozen from an unsupported platform capability. Distinguish Agent-channel visibility from Product UI capability, and never claim that BYQ lost details merely because you have not read the matching analysis section. When your final user-facing result is an optimization proposal, call byq_workflow_card_propose once with kind optimization and bounded presentation fields before answering."
        toolFilter:
          allow:
            - mcp__byq__byq_agent_context
            - mcp__byq__byq_agent_roles
            - mcp__byq__byq_agent_run_start
            - mcp__byq__byq_agent_authorize
            - mcp__byq__byq_agent_audit
            - mcp__byq__byq_research_get
            - mcp__byq__byq_backtest_task_prepare
            - mcp__byq__byq_backtest_task_create
            - mcp__byq__byq_backtest_task_get
            - mcp__byq__byq_backtest_analysis_get
            - mcp__byq__byq_backtest_task_execute
            - mcp__byq__byq_backtest_task_cancel
            - mcp__byq__byq_workflow_card_propose
        maxDepth: 1

    - id: delegate-ml-research
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: byq_delegate_ml_research
        enableRunInBackground: false
        backgroundMode: one-shot
        persona: "You are the BYQ ML researcher. Query the closed ML capability catalogue first, then locate owner-scoped workspace objects. You may create a bounded LightGBM strategy, manage trusted training and prediction, and execute only the derived backtest-task.v1 returned with that prediction. Never self-approve an ML strategy, access a model object/raw feature rows, create raw signals, or use the generic strategy signal producer. Request missing ML strategy approval in the global approval center, bind it to the exact strategy Artifact, end the current turn, and use the trusted Agent approval ID only after the same conversation is continued. Never send the user to a business page for approval. Authorize and audit every mutation separately. After training-action approval, re-read the ML workspace and reuse any run matching the same task, strategy Artifact, and frozen pool unless the user explicitly requested a new independent reproducibility run. Call training create at most once; on outcome_unknown, reconcile with one workspace read, never blindly retry or claim that no task exists. Answer in natural product language."
        toolFilter:
          allow:
            - mcp__byq__byq_agent_context
            - mcp__byq__byq_agent_roles
            - mcp__byq__byq_agent_run_start
            - mcp__byq__byq_agent_authorize
            - mcp__byq__byq_agent_audit
            - mcp__byq__byq_agent_approval_request
            - mcp__byq__byq_agent_approval_get
            - mcp__byq__byq_research_task_create
            - mcp__byq__byq_research_get
            - mcp__byq__byq_ml_capabilities
            - mcp__byq__byq_ml_workspace_get
            - mcp__byq__byq_ml_studies
            - mcp__byq__byq_ml_study_get
            - mcp__byq__byq_ml_strategy_create
            - mcp__byq__byq_ml_strategy_approve
            - mcp__byq__byq_ml_training_create
            - mcp__byq__byq_ml_training_get
            - mcp__byq__byq_ml_training_cancel
            - mcp__byq__byq_ml_prediction_create
            - mcp__byq__byq_ml_prediction_get
            - mcp__byq__byq_backtest_task_get
            - mcp__byq__byq_backtest_task_execute
            - mcp__byq__byq_backtest_task_cancel
        maxDepth: 1

    - id: mcp-byq
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: byq
        transport: streamable-http
        url: !!js process.env.BYQ_MCP_URL ?? 'http://mcp:8300/mcp/v1'
        headers:
          Authorization: !!js '`Bearer ${process.env.BYQ_MCP_TOKEN}`'
          X-BYQ-Owner-Principal: !!js process.env.BYQ_OWNER_PRINCIPAL
          X-BYQ-Workspace-Id: !!js process.env.BYQ_WORKSPACE_ID
          X-BYQ-Actor-Principal: !!js process.env.BYQ_ACTOR_PRINCIPAL
          X-BYQ-Trace-ID: !!js process.env.BYQ_TRACE_ID
          X-BYQ-Session-ID: !!js process.env.BYQ_SESSION_ID
          X-BYQ-DSH-Run-ID: !!js process.env.BYQ_DSH_RUN_ID
        failOnStartupError: true
