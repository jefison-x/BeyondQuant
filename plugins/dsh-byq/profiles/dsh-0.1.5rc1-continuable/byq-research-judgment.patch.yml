- insert:
    - id: trusted-time-context
      name: 'file:///opt/byq/runtime/byq-runtime-time-context.js'
      config:
        timezone: Asia/Shanghai

    # ADR-0085 P4: the bounded judgment composition loads ONLY the isolated
    # read-only MCP endpoint. It uses the DEDICATED read-only URL/token (never the
    # generic Product BYQ_MCP_URL/BYQ_MCP_TOKEN), with no fallback, so a missing
    # value fails startup instead of silently connecting to the full Product MCP.
    # The trusted Runtime Adapter must also fail closed if the read-only endpoint
    # or credential collides with the Product MCP.
    - id: mcp-byq-readonly
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: byq
        transport: streamable-http
        url: !!js process.env.BYQ_MCP_READ_ONLY_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.BYQ_MCP_READ_ONLY_TOKEN}`'
          X-BYQ-Owner-Principal: !!js process.env.BYQ_OWNER_PRINCIPAL
          X-BYQ-Workspace-Id: !!js process.env.BYQ_WORKSPACE_ID
          X-BYQ-Actor-Principal: !!js process.env.BYQ_ACTOR_PRINCIPAL
          X-BYQ-Trace-ID: !!js process.env.BYQ_TRACE_ID
          X-BYQ-Session-ID: !!js process.env.BYQ_SESSION_ID
          X-BYQ-DSH-Run-ID: !!js process.env.BYQ_DSH_RUN_ID
        failOnStartupError: true

    - id: research-judgment-turn
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: byq_research_judgment_turn
        enableRunInBackground: false
        backgroundMode: one-shot
        persona: "You are the BYQ bounded research-judgment role for exactly one research stage. Read ONLY the bounded stage input and bounded analysis summaries available to you. You have no write, approval, execution, routing, identity, idempotency or job tool, and you must never invent an object id, an idempotency key, a next action or an approval. Reach a bounded judgment (or an explicit evidence-insufficient/escalation stop) and return one closed result. If the judgment would need any write or routing capability, report the blocker instead of attempting it. Never expose internal schema fields, tool names or Artifact IDs."
        toolFilter:
          allow:
            - mcp__byq__byq_agent_context
            - mcp__byq__byq_research_get
            - mcp__byq__byq_research_stage_input_get
            - mcp__byq__byq_backtest_task_get
            - mcp__byq__byq_backtest_analysis_get
        # ADR-0085 P4: the bounded role is the FIRST delegation level (depth 1).
        # maxDepth must be 1 to allow that level; a grandchild would be depth 2
        # and is refused, so the role still cannot spawn further subagents.
        maxDepth: 1
