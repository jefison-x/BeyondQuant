# BYQ Product SDK composition. This is the single Product capability source
# for the explicit stdio JSON-RPC runtime; it intentionally has no coding
# executor, filesystem mutation, Git, or Engineering Plane plugin.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    toolBash: false
    toolJobs: false
    skills:
      enabled: false
    workspaceContext: false
    goals: false

# Generic wall-clock awareness belongs to DSH. The provider is evaluated for
# every prompt assembly and persists as a sourced runtime-context snapshot; it
# is deliberately distinct from BYQ trading-session/data-cutoff semantics.
- id: trusted-time-context
  name: '../runtime/byq-runtime-time-context.js'
  config:
    timezone: Asia/Shanghai

# OpenCode Go and Zen publish mixed-protocol catalogues. DSH's official
# pi-ai adapter owns one fixed route per wire protocol; all six routes resolve
# the same per-session write-only credential reference. Endpoints and models
# are deployment-owned allowlists, never browser-supplied URLs or model IDs.
- id: llm-opencode
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go-responses:
        displayName: OpenCode Go · Responses
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-responses
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: gpt-5.6-luna
          - id: grok-4.6
      opencode-go-chat:
        displayName: OpenCode Go · Chat Completions
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: deepseek-v4-flash
          - id: deepseek-v4-pro
          - id: glm-5.3
          - id: kimi-k3
      opencode-go-messages:
        displayName: OpenCode Go · Messages
        apiKeyEnv: OPENCODE_API_KEY
        api: anthropic-messages
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: minimax-m3
          - id: qwen3.8-max
      opencode-zen-responses:
        displayName: OpenCode Zen · Responses
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-responses
        baseURL: https://opencode.ai/zen/v1
        models:
          - id: gpt-5.6-sol
          - id: gpt-5.6-terra
          - id: grok-4.6
      opencode-zen-chat:
        displayName: OpenCode Zen · Chat Completions
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        models:
          - id: deepseek-v4-flash
          - id: minimax-m3
      opencode-zen-messages:
        displayName: OpenCode Zen · Messages
        apiKeyEnv: OPENCODE_API_KEY
        api: anthropic-messages
        baseURL: https://opencode.ai/zen/v1
        models:
          - id: claude-opus-5
          - id: claude-sonnet-5
          - id: qwen3.7-max

- id: skills
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /opt/dsh/bundles/dsh-byq/skills

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: subagents
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: delegate-market-research
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: byq_delegate_market_research
    enableRunInBackground: false
    persona: "You are the BYQ market researcher. Collect normalized market evidence, record bounded provenance, and do not design strategies, create or mutate Stock Pools, run backtests, or approve actions. Authorize and audit each exact action: byq_market_session_context for trading-day and persisted-data cutoff facts, byq_market_daily for prices, byq_market_valuation for one explicit valuation session, and byq_market_fundamentals for announcement-visible reported indicators. Tool steps contain tool calls only: never narrate authorization, audit, tool selection, or transitions alongside them. After tool work, return one text-only user-facing result. The trusted runtime clock answers natural date/time only; never infer a trading session or data cutoff from it. Valuation/fundamental tools read durable BYQ data only; never claim a provider refresh, fill nulls, use later reports, or rank when coverage.usable is false. State the data date/report period and missing coverage in product language, never raw coverage or provider field keys. Never explain a valuation difference with unqueried or unavailable profitability, asset-quality, growth, risk, or industry facts; say the cause is not established by the available data. Return frozen candidates with canonical symbols and evidence date to the coordinator; cross-check signed figures and rankings between the card and answer. Keep role IDs, skills, tool names, and Artifact IDs out of public narration. When your final user-facing result is a stock-candidate list, call byq_workflow_card_propose once with kind stock_candidates and a bounded presentation summary before answering."
    toolFilter:
      allow:
        - byq_agent_context
        - byq_agent_roles
        - byq_agent_run_start
        - byq_agent_authorize
        - byq_agent_audit
        - byq_market_session_context
        - byq_market_daily
        - byq_market_valuation
        - byq_market_fundamentals
        - byq_research_task_create
        - byq_research_get
        - byq_experiment_create
        - byq_artifact_create
        - byq_workflow_card_propose
    maxDepth: 1

- id: delegate-factor-research
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: byq_delegate_factor_research
    enableRunInBackground: false
    persona: "You are the BYQ factor researcher. Compute only reproducible BYQ factors from point-in-time inputs and record lineage; do not approve strategies or execute backtests. When your final user-facing result is an optimization proposal, call byq_workflow_card_propose once with kind optimization and bounded presentation fields before answering."
    toolFilter:
      allow:
        - byq_agent_context
        - byq_agent_roles
        - byq_agent_run_start
        - byq_agent_authorize
        - byq_agent_audit
        - byq_market_daily
        - byq_factor_compute
        - byq_research_get
        - byq_experiment_create
        - byq_artifact_create
        - byq_workflow_card_propose
    maxDepth: 1

- id: delegate-strategy-research
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: byq_delegate_strategy_research
    enableRunInBackground: false
    persona: "You are the BYQ strategy researcher. Produce validated strategy artifacts only; strategy code remains domain data, and approval/execution are outside your role. Define class CustomStrategy with exactly one synchronous generate_signals(self, data, parameters) or generate_target_weights(self, data, portfolio_state, parameters). A planned research task is valid. Use safe BYQ validation detail for at most one repair, then stop rather than guessing states, roles, payload shapes, or Artifact IDs. Follow the fixed sequence: if needed authorize/create/audit byq_research_task_create; then authorize/validate/audit byq_strategy_validate; then authorize/create/audit byq_strategy_version_create. Tool steps contain tool calls only; answer once, in product language, after tool work. One authorization never covers another action. Keep role IDs, skills, tools, Artifact IDs, validator versions, workers, and runtimes out of public narration. When your final user-facing result is a strategy draft or optimization proposal, call byq_workflow_card_propose once with the matching kind and bounded presentation fields before answering."
    toolFilter:
      allow:
        - byq_agent_context
        - byq_agent_roles
        - byq_agent_run_start
        - byq_agent_authorize
        - byq_agent_audit
        - byq_research_task_create
        - byq_research_get
        - byq_experiment_create
        - byq_artifact_create
        - byq_strategy_validate
        - byq_strategy_version_create
        - byq_strategy_export
        - byq_workflow_card_propose
    maxDepth: 1

- id: delegate-backtest-analysis
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: byq_delegate_backtest_analysis
    enableRunInBackground: false
    persona: "You are the BYQ backtest analyst. Inspect authorized deterministic jobs and report evidence; consequential submission and execution remain approval-gated BYQ actions. When your final user-facing result is an optimization proposal, call byq_workflow_card_propose once with kind optimization and bounded presentation fields before answering."
    toolFilter:
      allow:
        - byq_agent_context
        - byq_agent_roles
        - byq_agent_run_start
        - byq_agent_authorize
        - byq_agent_audit
        - byq_research_get
        - byq_backtest_get
        - byq_backtest_submit
        - byq_backtest_run
        - byq_workflow_card_propose
    maxDepth: 1

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: mcp-byq
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: byq
    transport: streamable-http
    url: !!js process.env.BYQ_MCP_URL ?? 'http://mcp:8300/mcp/v1'
    headers:
      Authorization: !!js '`Bearer ${process.env.BYQ_MCP_TOKEN}`'
      X-BYQ-Owner-Principal: !!js process.env.BYQ_OWNER_PRINCIPAL
      X-BYQ-Workspace-Id: !!js process.env.BYQ_WORKSPACE_ID
      X-BYQ-Actor-Principal: !!js process.env.BYQ_ACTOR_PRINCIPAL
      X-BYQ-Trace-ID: !!js process.env.BYQ_TRACE_ID
      X-BYQ-Session-ID: !!js process.env.BYQ_SESSION_ID
      X-BYQ-DSH-Run-ID: !!js process.env.BYQ_DSH_RUN_ID
    failOnStartupError: true
