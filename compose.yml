services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byq_domain}
      POSTGRES_USER: ${POSTGRES_USER:-byq_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byq-app-dev}
    volumes:
      - byq_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - byq_product
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - byq_product
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/ >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      BYQ_PRODUCT_TOKEN: ${BYQ_PRODUCT_TOKEN:?BYQ_PRODUCT_TOKEN must be set}
      BYQ_PRODUCT_PRINCIPAL: ${BYQ_PRODUCT_PRINCIPAL:-product-user}
      BYQ_WORKFLOW_TRACE_ROOT: /var/lib/byq/workflow-traces
      BYQ_BACKEND_URL: http://backend:8000
    restart: unless-stopped
    volumes:
      - byq_workflow_traces:/var/lib/byq/workflow-traces
    networks:
      - byq_product
    depends_on:
      runtime-adapter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8100/readyz', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  runtime-adapter:
    build:
      context: .
      dockerfile: services/runtime-adapter/Dockerfile
    environment:
      BYQ_MCP_TOKEN: ${BYQ_MCP_TOKEN:?BYQ_MCP_TOKEN must be set}
      BYQ_MCP_URL: http://mcp:8300/mcp/v1
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BYQ_DSH_RUNTIME_ROOT: /opt/dsh-runtime
      BYQ_DSH_COMPOSITION: /opt/byq/compositions/byq-product-sdk.cordis.yml
      DSH_SESSION_ROOT: /var/lib/byq/dsh-sessions
    volumes:
      - byq_dsh_sessions:/var/lib/byq/dsh-sessions
    networks:
      - byq_product
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8400/readyz', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    environment:
      BYQ_BACKEND_URL: http://backend:8000
      BYQ_MCP_TOKEN: ${BYQ_MCP_TOKEN:?BYQ_MCP_TOKEN must be set}
    networks:
      - byq_product
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8300/healthz').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    networks:
      - byq_product
    environment:
      BYQ_DATABASE_URL: ${BYQ_DATABASE_URL:-postgresql+psycopg://byq_app:byq-app-dev@postgres:5432/byq_domain}
      BYQ_BACKTEST_OBJECT_ROOT: /var/lib/byq/domain/backtest-objects
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-http://api.tushare.pro}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - byq_domain_state:/var/lib/byq/domain
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  byq_product:
    name: byq_product
    driver: bridge

volumes:
  byq_postgres_data:
    name: byq_postgres_data
  byq_domain_state:
    name: byq_domain_state
  byq_dsh_sessions:
    name: byq_dsh_sessions
  byq_workflow_traces:
    name: byq_workflow_traces
