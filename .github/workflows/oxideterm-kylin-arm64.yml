name: Build OxideTerm for Kylin V11 ARM64

on:
  push:
    branches:
      - build/oxideterm-kylin-arm64
    paths:
      - .github/workflows/oxideterm-kylin-arm64.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/oxideterm-kylin-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kylin V11 ARM64 (Ubuntu 22.04 ARM64 / glibc 2.35 baseline)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout upstream OxideTerm
        uses: actions/checkout@v4
        with:
          repository: AnalyseDeCircuit/oxideterm
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and package inside Ubuntu 22.04 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" \
            -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y \
                ca-certificates curl git python3 \
                build-essential clang cmake pkg-config \
                libasound2-dev libclang-dev libdbus-1-dev \
                libfontconfig1-dev libfreetype6-dev \
                libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
                libkrb5-dev libssl-dev libunwind-dev \
                libx11-dev libxcb-cursor-dev libxcb-icccm4-dev \
                libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
                libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                libxcb-xinerama0-dev libxkbcommon-dev libxkbcommon-x11-dev \
                mesa-vulkan-drivers \
                file patchelf desktop-file-utils dpkg-dev rpm freerdp2-dev

              echo "ARM64 build baseline:"
              uname -m
              ldd --version | head -1

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.94.1
              . "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-gnu
              rustc -Vv

              curl -L --retry 3 \
                -o /tmp/appimagetool \
                https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
              echo "a48972e5ae91c944c5a7c80214e7e0a42dd6aa3ae979d8756203512a74ff574d  /tmp/appimagetool" \
                | sha256sum --check --strict
              chmod +x /tmp/appimagetool
              mv /tmp/appimagetool /usr/local/bin/appimagetool

              export APPIMAGE_EXTRACT_AND_RUN=1
              python3 scripts/release/package_native.py aarch64-unknown-linux-gnu

              BIN=target/aarch64-unknown-linux-gnu/release/oxideterm-native
              test -x "$BIN"
              max_glibc="$(objdump -T "$BIN" | grep -oE "GLIBC_[0-9]+\\.[0-9]+" | sort -Vu | tail -1)"
              echo "Highest GLIBC symbol required: $max_glibc"
              printf "%s\n" "$max_glibc" > dist/GLIBC_REQUIREMENT.txt
              printf "Built on: " >> dist/GLIBC_REQUIREMENT.txt
              ldd --version | head -1 >> dist/GLIBC_REQUIREMENT.txt
              if [ "$(printf "%s\n" GLIBC_2.38 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.38" ]; then
                echo "ERROR: binary requires newer than GLIBC 2.38: $max_glibc" >&2
                exit 1
              fi

              deb="$(find dist -maxdepth 1 -type f -name "*.deb" | head -1)"
              test -n "$deb"
              echo "Debian package metadata:"
              dpkg-deb -I "$deb" | sed -n "1,120p"
            '

      - name: Show produced files
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh dist
          cat dist/GLIBC_REQUIREMENT.txt

      - name: Upload Kylin-compatible packages
        uses: actions/upload-artifact@v4
        with:
          name: OxideTerm-KylinV11-arm64-glibc238
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.deb
            dist/*_portable.tar.gz
            dist/*.AppImage
            dist/GLIBC_REQUIREMENT.txt
