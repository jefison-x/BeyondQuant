# BeyondQuant Self-Hosted CI
#
# TEMPORARY BRANCH OVERRIDE:
# This build-only branch is used to package upstream OxideTerm for Kylin V11.
# Skip the normal BYQ CI job here so the single self-hosted runner is available
# for the dedicated OxideTerm packaging workflow. This branch is not for merge.
name: BeyondQuant Self-Hosted CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: CI profile to execute
        required: true
        default: full
        type: choice
        options:
          - selective
          - full
  schedule:
    - cron: '0 19 * * *'

concurrency:
  group: byq-ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-ci:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, byq]
    timeout-minutes: 30
    steps:
      - run: echo "Skipped on temporary OxideTerm build branch"
