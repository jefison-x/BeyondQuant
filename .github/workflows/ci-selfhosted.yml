# Filename retained for workflow history; all jobs use standard ephemeral VMs.
# Production runners must be deregistered, not merely excluded by YAML routing.
name: BeyondQuant CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: CI profile to execute
        required: true
        default: full
        type: choice
        options:
          - selective
          - full
  schedule:
    # 03:00 Asia/Shanghai: full drift detection without duplicating every merge.
    - cron: '0 19 * * *'

concurrency:
  group: byq-ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Guard against any future opt-in compose usage colliding with the
      # developer's local stack project name.
      COMPOSE_PROJECT_NAME: byq-ci-runner
      COMPOSE_PARALLEL_LIMIT: '2'
      # A pull request's base SHA is immutable even if main advances or the PR
      # is squash-merged while this job is queued/running.
      BYQ_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      BYQ_CI_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
      # A cancelled parallel BuildKit request may finish publishing an exact
      # run-scoped tag after the client exits. Cleanup requires two stable,
      # bounded zero-resource observations.
      BYQ_CI_CLEANUP_MAX_ATTEMPTS: '20'
      BYQ_CI_CLEANUP_RETRY_SECONDS: '3'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Inspect ephemeral runner capacity
        run: |
          free -m
          df -h . /var/lib/docker
          docker version
          docker compose version

      - name: Install browser OS dependencies
        run: |
          cd apps/frontend
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install-deps chromium

      - name: Scan new Git history for secrets
        run: |
          audit_dir="$(mktemp -d "$RUNNER_TEMP/byq-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$audit_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git --redact=100 --no-banner --log-opts="$BYQ_CI_BASE_SHA..HEAD"

      - name: Fetch main baseline for path filtering
        run: |
          if [ "$BYQ_CI_BASE_SHA" != "HEAD^" ]; then
            git fetch --quiet origin "$BYQ_CI_BASE_SHA"
          fi

      - name: Run risk-selected or full CI profile
        env:
          BYQ_CI_PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          {
            if [ "${{ github.event_name }}" = "pull_request" ] || [ "$BYQ_CI_PROFILE" = "selective" ]; then
              ./scripts/ci/local-ci.sh --base="$BYQ_CI_BASE_SHA" --with-e2e --auto-smoke
            else
              ./scripts/ci/local-ci.sh --base="${BYQ_CI_BASE_SHA:-HEAD^}" --all --with-e2e --with-smoke
            fi
          } 2>&1 | python3 scripts/ci/redact-log.py | tee .ci-artifacts/checks.log

      - name: Verify run-scoped resource cleanup
        if: always()
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          ./scripts/ci/cleanup-resources.sh --scope="$BYQ_CI_SCOPE" 2>&1 | python3 scripts/ci/redact-log.py | tee .ci-artifacts/cleanup.log

      - name: Upload sanitized CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/*.log
          retention-days: 7

  contribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Verify exact-head individual contribution authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 scripts/ci/check-contribution.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --expected-head "$PR_HEAD"
          else
            echo 'Scheduled/manual CI has no incoming contribution.'
          fi

  ci-gate:
    if: always()
    needs: [local-ci, contribution]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require executed checks and cleanup
        env:
          CI_RESULT: ${{ needs.local-ci.result }}
          CONTRIBUTION_RESULT: ${{ needs.contribution.result }}
        run: |
          test "$CI_RESULT" = success
          test "$CONTRIBUTION_RESULT" = success
