name: Phase 5 + Phase 6 + Phase 7 + Phase 8 + Phase 9 CI

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
  pull_request:

jobs:
  phase7:
    runs-on: ubuntu-latest
    env:
      BYQ_MCP_TOKEN: ci-phase5-test-only
      BYQ_PRODUCT_TOKEN: ci-phase7-product-test-only
      BYQ_PRODUCT_PRINCIPAL: ci-product-user

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check committed push diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"

      - name: Architecture tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Compose config
        run: docker compose config

      - name: Build service images
        run: docker compose build

      - name: Start healthy topology
        run: docker compose up -d --wait

      - name: Backend tests
        run: docker compose exec -T backend python -m pytest -q -p no:cacheprovider

      - name: Gateway tests
        run: docker compose exec -T gateway python -m pytest -q -p no:cacheprovider

      - name: Runtime Adapter tests
        run: docker compose exec -T runtime-adapter python3 -m pytest -q -p no:cacheprovider

      - name: MCP tests
        run: docker compose exec -T mcp npm test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Frontend build
        working-directory: apps/frontend
        run: npm run build

      - name: Frontend unit tests
        working-directory: apps/frontend
        run: npm run test

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend Playwright smoke
        working-directory: apps/frontend
        run: npm run test:e2e

      - name: Full smoke
        run: ./tests/smoke/run.sh

      - name: DSH Web diagnostic profile config
        run: docker compose -f compose.yml -f compose.dsh-web.yml --profile dsh-web config

      - name: Build DSH Web diagnostic profile
        run: docker compose -f compose.yml -f compose.dsh-web.yml --profile dsh-web build dsh

      - name: Start DSH Web diagnostic profile
        run: docker compose -f compose.yml -f compose.dsh-web.yml --profile dsh-web up -d --wait

      - name: DSH Web diagnostic smoke
        run: ./tests/smoke/run-dsh-web.sh

      - name: Cleanup Compose
        if: always()
        run: docker compose -f compose.yml -f compose.dsh-web.yml --profile dsh-web down -v
