openapi: 3.0.3
info:
  title: BeyondQuant Browser API
  version: 0.2.0
  description: >-
    面向 browser 的 Gateway contract。普通 browser authentication 使用 HttpOnly
    byq_session cookie。bearer scheme 仅用于 internal/bootstrap compatibility。
    不暴露 Backend、MCP、DSH、provider、credential 或 raw storage contract。
servers:
  - url: /
security:
  - sessionCookie: []
  - bearerBootstrap: []

x-ok-responses: &okResponses
  "200": {description: Successful normalized BYQ response.}
x-created-responses: &createdResponses
  "201": {description: Resource created.}
x-accepted-responses: &acceptedResponses
  "202": {description: Request accepted.}
x-no-content-responses: &noContentResponses
  "200": {description: Resource released or deleted.}

paths:
  /api/auth/login:
    post: {summary: 创建 a durable browser session., security: [], responses: *okResponses}
  /api/auth/logout:
    post: {summary: 撤销 the current browser session., responses: *okResponses}
  /api/auth/me:
    get: {summary: 解析 the current browser principal and role., responses: *okResponses}

  /api/product/health:
    get: {summary: 返回 Product API health., responses: *okResponses}
  /api/product/auth/login:
    post: {summary: 提供 compatibility login under the Product API prefix., security: [], responses: *okResponses}
  /api/product/auth/logout:
    post: {summary: 提供 compatibility logout under the Product API prefix., responses: *okResponses}
  /api/product/auth/me:
    get: {summary: 解析 the current Product API principal., responses: *okResponses}
  /api/product/dashboard:
    get: {summary: 返回 the bounded dashboard projection., responses: *okResponses}
  /api/product/data/status:
    get: {summary: 返回 provider and migration status without credentials., responses: *okResponses}
  /api/product/data-center/status:
    get: {summary: 返回 Tushare source metadata, sync history, and observed PostgreSQL coverage without secrets., responses: *okResponses}
  /api/product/data-center/automation:
    get: {summary: 返回 administrator-visible daily market synchronization configuration, worker health, completeness, and job state., responses: *okResponses}
  /api/product/data-center/automation/config:
    put: {summary: 更新 the versioned daily market synchronization schedule and catch-up policy., responses: *okResponses}
  /api/product/data-center/automation/run-now:
    post: {summary: 排队 an administrator-requested daily market synchronization scheduler run., responses: *acceptedResponses}
  /api/product/data-center/automation/run-now/{request_id}:
    parameters: [{$ref: "#/components/parameters/RequestId"}]
    get: {summary: 获取 one administrator-requested daily market synchronization run., responses: *okResponses}
  /api/product/data-center/source/credentials:
    post: {summary: 创建 the admin-only write-only Tushare system credential., responses: *createdResponses}
  /api/product/data-center/source/credentials/{credential_id}:
    parameters: [{$ref: "#/components/parameters/CredentialId"}]
    put: {summary: 替换 or enable/disable the admin-only Tushare credential with optimistic concurrency., responses: *okResponses}
  /api/product/data-center/source/credentials/{credential_id}/revoke:
    parameters: [{$ref: "#/components/parameters/CredentialId"}]
    post: {summary: 撤销 the Tushare credential and erase its encrypted envelope., responses: *okResponses}
  /api/product/data-center/source/test:
    post: {summary: 测试 the effective Tushare credential through one bounded daily request., responses: *okResponses}
  /api/product/data-center/sync-jobs:
    post: {summary: 创建 and execute an admin-only bounded durable Tushare sync job., responses: *createdResponses}
  /api/product/data-center/sync-jobs/{job_id}:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get: {summary: 获取 one durable Tushare sync job and its normalized symbol results., responses: *okResponses}
  /api/product/data-center/security-master/sync-jobs:
    post: {summary: 原子同步 the complete admin-only A-share security master., responses: *createdResponses}
  /api/product/data-center/security-master/sync-jobs/{job_id}:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get: {summary: 获取 one security-master synchronization job without provider secrets., responses: *okResponses}
  /api/product/data-center/securities:
    get: {summary: 搜索并分页返回 the normalized A-share security catalogue bound to its immutable snapshot., responses: *okResponses}
  /api/product/data-center/coverage:
    get: {summary: 返回 an honest audit of persisted observed market-data coverage and quality., responses: *okResponses}
  /api/product/data-center/readiness:
    post: {summary: 检查一个有界研究或回测范围能否使用已持久化 BYQ 行情，并返回缺口和下一步。, responses: *okResponses}
  /api/product/operations/status:
    get: {summary: 返回 the admin-only browser-safe operations projection., responses: *okResponses}
  /api/product/operations/budget:
    put: {summary: 更新 audited Product Agent usage-monitoring thresholds., responses: *okResponses}
  /api/product/plugins:
    get: {summary: 返回 admin-only、secret-free Plugin Registry、desired policy 与 active runtime identity 投影。, responses: *okResponses}
  /api/product/plugins/{plugin_id}:
    parameters: [{$ref: "#/components/parameters/PluginId"}]
    get: {summary: 返回一个 registered plugin 的资格、风险、证据 ID 与最近治理请求。, responses: *okResponses}
  /api/product/plugins/changes:
    post: {summary: 创建 versioned、idempotent 的 Product plugin policy deployment change request；不热修改 runtime。, responses: *acceptedResponses}
  /api/product/plugins/qualifications:
    post: {summary: 为已登记的 exact plugin version 排队 Qualification；成功也不会自动启用。, responses: *acceptedResponses}

  /api/product/research/{entity_type}/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityId"
    get: {summary: 获取 one owner-scoped research entity., responses: *okResponses}
  /api/product/research/tasks:
    get: {summary: 列出 owner-scoped research tasks., responses: *okResponses}
    post: {summary: 创建 an owner-scoped research task with server-owned identity fields., responses: *createdResponses}
  /api/product/research/experiments:
    get: {summary: 列出 owner-scoped experiments., responses: *okResponses}
  /api/product/research/artifacts:
    get: {summary: 列出 owner-scoped artifacts., responses: *okResponses}
  /api/product/ml/workspace:
    get: {summary: 返回 owner-scoped LightGBM 研究工作区安全投影，不包含模型对象地址或原始特征行。, responses: *okResponses}
  /api/product/ml/strategies/versions:
    post: {summary: 冻结一个 closed-profile LightGBM 策略版本。, responses: *createdResponses}
  /api/product/ml/strategies/approvals:
    post: {summary: 记录 LightGBM 策略版本的显式人工批准或拒绝。, responses: *createdResponses}
  /api/product/ml/training-runs:
    post: {summary: 对冻结股票池提交 durable LightGBM 训练。, responses: *acceptedResponses}
  /api/product/ml/training-runs/{run_id}:
    parameters: [{$ref: "#/components/parameters/RunId"}]
    get: {summary: 获取 owner-scoped LightGBM 训练状态和制品 ID。, responses: *okResponses}
  /api/product/ml/training-runs/{run_id}/cancel:
    parameters: [{$ref: "#/components/parameters/RunId"}]
    post: {summary: 取消可取消的 owner-scoped LightGBM 训练。, responses: *okResponses}
  /api/product/ml/prediction-runs:
    post: {summary: 提交样本外预测并生成冻结信号。, responses: *acceptedResponses}
  /api/product/ml/prediction-runs/{run_id}:
    parameters: [{$ref: "#/components/parameters/RunId"}]
    get: {summary: 获取 owner-scoped 样本外预测和冻结信号制品 ID。, responses: *okResponses}
  /api/product/factors:
    get: {summary: 列出 owner-scoped factor results., responses: *okResponses}
  /api/product/signal-snapshots:
    get: {summary: 列出 owner-scoped signal snapshots., responses: *okResponses}
  /api/product/signal-producer/jobs:
    get: {summary: 列出 owner-scoped isolated signal-production jobs., responses: *okResponses}
    post: {summary: 冻结 canonical inputs and enqueue isolated signal production., responses: *acceptedResponses}
  /api/product/signal-producer/jobs/{job_id}:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get: {summary: 获取 one owner-scoped signal-production job status., responses: *okResponses}

  /api/product/backtests:
    get: {summary: 列出 owner-scoped backtest jobs., responses: *okResponses}
    post: {summary: 提交 an owner-scoped backtest job., responses: *acceptedResponses}
  /api/product/backtests/options:
    get: {summary: 列出 runnable owner-scoped backtest options., responses: *okResponses}
  /api/product/backtests/{job_id}:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get: {summary: 获取 one owner-scoped backtest job., responses: *okResponses}
    delete: {summary: 删除 one owner-scoped backtest job., responses: *noContentResponses}
  /api/product/backtests/{job_id}/result:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get: {summary: 获取 an immutable owner-scoped backtest result., responses: *okResponses}
  /api/product/backtests/{job_id}/run:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post: {summary: 运行 one owner-scoped backtest job., responses: *okResponses}
  /api/product/backtests/{job_id}/cancel:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post: {summary: 取消 one owner-scoped backtest job., responses: *okResponses}

  /api/product/strategies:
    get: {summary: 列出 owner-scoped strategy artifacts., responses: *okResponses}
  /api/product/strategies/drafts:
    post: {summary: 保存 an owner-scoped strategy draft., responses: *createdResponses}
  /api/product/strategies/drafts/{artifact_id}:
    parameters: [{$ref: "#/components/parameters/ArtifactId"}]
    delete: {summary: 将 an owner-scoped strategy draft., responses: *noContentResponses}
  /api/product/strategies/validate:
    post: {summary: 验证 an owner-scoped strategy draft., responses: *createdResponses}
  /api/product/strategies/versions:
    post: {summary: 创建 an immutable owner-scoped strategy version., responses: *createdResponses}
  /api/product/strategies/approvals:
    post: {summary: 记录 the owner's explicit human approval for a validated strategy version., responses: *createdResponses}
  /api/product/strategies/versions/{artifact_id}/export:
    parameters: [{$ref: "#/components/parameters/ArtifactId"}]
    get: {summary: 导出 one owner-scoped strategy version., responses: *okResponses}
  /api/product/strategies/{strategy_id}/versions:
    parameters: [{$ref: "#/components/parameters/StrategyId"}]
    get: {summary: 列出 owner-scoped strategy version history., responses: *okResponses}
  /api/product/strategies/{strategy_id}/backtest-count:
    parameters: [{$ref: "#/components/parameters/StrategyId"}]
    get: {summary: 返回 owner-scoped strategy backtest counts., responses: *okResponses}

  /api/product/approvals:
    get: {summary: 列出 owner-scoped approvals., responses: *okResponses}
  /api/product/approvals/{approval_id}:
    parameters: [{$ref: "#/components/parameters/ApprovalId"}]
    get: {summary: 获取 one owner-scoped approval., responses: *okResponses}
  /api/product/approvals/{approval_id}/decision:
    parameters: [{$ref: "#/components/parameters/ApprovalId"}]
    post: {summary: 记录 an owner-scoped approval decision., responses: *okResponses}

  /api/product/profile:
    get: {summary: 返回 the authenticated user profile., responses: *okResponses}
    put: {summary: 更新 the authenticated user profile., responses: *okResponses}
  /api/product/settings/appearance:
    get: {summary: 返回 the authenticated owner's ui-preferences.v1 appearance settings., responses: *okResponses}
    put: {summary: 持久化 closed color-mode and accent values with optimistic concurrency., responses: *okResponses}
  /api/product/settings/status:
    get: {summary: 返回 user settings capability status., responses: *okResponses}
  /api/product/settings/models:
    get: {summary: 返回 a secret-free model capability projection., responses: *okResponses}
  /api/product/settings/models/credentials:
    post: {summary: 创建 an owner-scoped write-only model credential., responses: *createdResponses}
  /api/product/settings/models/credentials/{credential_id}:
    put: {summary: 替换 metadata or the write-only secret with optimistic concurrency., responses: *okResponses}
  /api/product/settings/models/credentials/{credential_id}/revoke:
    post: {summary: 撤销 an owner-scoped credential and disable dependent bindings., responses: *okResponses}
  /api/product/settings/models/profiles:
    post: {summary: 创建 an owner-scoped model profile from the reviewed catalogue., responses: *createdResponses}
  /api/product/settings/models/profiles/{profile_id}/delete:
    post: {summary: 软删除 a model profile and unbind it., responses: *okResponses}
  /api/product/settings/models/bindings/{agent_id}:
    put: {summary: 绑定 or unbind one BYQ Agent preset to an owner-scoped model profile., responses: *okResponses}
  /api/product/settings/agent-policy:
    get: {summary: 返回 platform and personal agent policy., responses: *okResponses}
    put: {summary: 更新 personal agent policy., responses: *okResponses}
  /api/product/settings/agent-policy/rules:
    post: {summary: 创建 an owner-scoped Agent authorization rule., responses: *createdResponses}
  /api/product/settings/agent-policy/rules/{rule_id}:
    put: {summary: 更新 an owner-scoped Agent authorization rule with optimistic concurrency., responses: *okResponses}
  /api/product/settings/agent-policy/rules/{rule_id}/delete:
    post: {summary: 删除 an owner-scoped Agent authorization rule., responses: *okResponses}
  /api/product/settings/agent-policy/presets/{preset_id}/apply:
    post: {summary: 替换 personal policy settings and rules from a BYQ preset., responses: *okResponses}
  /api/product/settings/assets:
    get: {summary: 返回 owner-scoped workspace assets., responses: *okResponses}
  /api/product/settings/assets/export:
    get: {summary: 导出 a secret-free owner-scoped asset bundle., responses: *okResponses}
  /api/product/settings/assets/import:
    post: {summary: 导入 a validated owner-scoped asset bundle., responses: *okResponses}

  /api/product/admin/users:
    get: {summary: 列出 users as an authenticated administrator., responses: *okResponses}
  /api/product/admin/users/{user_id}/disable:
    parameters: [{$ref: "#/components/parameters/UserId"}]
    post: {summary: 禁用 one user as an authenticated administrator., responses: *okResponses}

  /api/product/paper/accounts:
    get: {summary: 列出 owner-scoped paper accounts., responses: *okResponses}
    post: {summary: 创建 an owner-scoped paper account., responses: *createdResponses}
  /api/product/paper/accounts/{account_id}:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 获取 one owner-scoped paper account., responses: *okResponses}
    delete: {summary: 以审计 tombstone 删除 owner-scoped paper account while retaining immutable history., responses: *okResponses}
  /api/product/paper/pools:
    parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}]
    get: {summary: 列出 owner-scoped stock pools., responses: *okResponses}
    post: {summary: 创建 an owner-scoped stock pool., responses: *createdResponses}
  /api/product/paper/index-pools/catalog:
    get: {summary: 列出 six canonical index candidates with verified-snapshot readiness and no provider access., responses: *okResponses}
  /api/product/paper/index-pools:
    post: {summary: 创建 owner-scoped index pool definition and enqueue trusted materialization., responses: *createdResponses}
  /api/product/paper/dynamic-pools/preview:
    post: {summary: 以 point-in-time inputs 预览 closed dynamic rule；结果不构成权威快照., responses: *okResponses}
  /api/product/paper/dynamic-pools:
    post: {summary: 创建 owner-scoped dynamic pool definition and optionally enqueue trusted materialization., responses: *createdResponses}
  /api/product/paper/pools/{pool_id}:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    get:
      summary: 获取 one owner-scoped stock pool.
      parameters:
        - {name: include_members, in: query, schema: {type: boolean, default: true}}
      responses: *okResponses
    delete: {summary: 以 tombstone 方式删除 an owner-scoped stock pool while retaining snapshots., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/members:
    parameters:
      - {$ref: "#/components/parameters/PoolId"}
      - {name: query, in: query, schema: {type: string, maxLength: 80}}
      - {$ref: "#/components/parameters/Limit"}
      - {$ref: "#/components/parameters/Offset"}
    get: {summary: 分页筛选 current immutable members with non-authoritative Chinese display names., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/metadata:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    patch: {summary: 更新 mutable stock-pool catalog metadata without creating a snapshot., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/snapshot:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    put: {summary: 追加 or idempotently reuse an immutable membership snapshot., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/snapshots:
    parameters: [{$ref: "#/components/parameters/PoolId"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}]
    get: {summary: 列出 immutable stock-pool snapshot history., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/snapshot-diff:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    get: {summary: 比较 two owner-scoped immutable snapshots with added removed and weight-changed members., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/readiness:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    get: {summary: 获取 derived current stale waiting failed or paused producer readiness., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/snapshots/{snapshot_id}:
    parameters: [{$ref: "#/components/parameters/PoolId"}, {$ref: "#/components/parameters/SnapshotId"}]
    get: {summary: 获取 one immutable stock-pool snapshot., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/lifecycle:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    patch: {summary: 激活、停用或 tombstone a stock pool., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/as-of/{trade_date}:
    parameters: [{$ref: "#/components/parameters/PoolId"}, {$ref: "#/components/parameters/TradeDate"}]
    get: {summary: 解析 the latest persisted index snapshot at or before a trade date., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/references:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    get: {summary: 列出 bounded owner-safe downstream stock-pool references., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/producer:
    parameters: [{$ref: "#/components/parameters/PoolId"}]
    get: {summary: 获取 owner-scoped normalized stock-pool producer definition., responses: *okResponses}
    put: {summary: 以 optimistic version 更新 closed dynamic rule and lifecycle state., responses: *okResponses}
  /api/product/paper/pools/{pool_id}/materializations:
    parameters: [{$ref: "#/components/parameters/PoolId"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}]
    get: {summary: 列出 owner-scoped stock-pool materialization history., responses: *okResponses}
    post: {summary: 幂等排队 trusted index-pool refresh without provider access from Product Plane., responses: *createdResponses}
  /api/product/paper/orders:
    post: {summary: 提交 an owner-scoped paper order., responses: *createdResponses}
  /api/product/paper/accounts/{account_id}/orders:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 列出 owner-scoped paper orders., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/orders/{order_id}:
    parameters: [{$ref: "#/components/parameters/AccountId"}, {$ref: "#/components/parameters/OrderId"}]
    get: {summary: 获取 one persisted owner-scoped paper order audit projection., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/positions:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 列出 owner-scoped paper positions., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/fills:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 列出 owner-scoped paper fills., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/ledger:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 列出 the owner-scoped paper ledger., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/snapshots:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 列出 immutable owner-scoped daily paper account snapshots., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/settlements:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    post: {summary: 执行 an idempotent manual paper-account settlement., responses: *createdResponses}
  /api/product/paper/accounts/{account_id}/controls:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 获取 versioned paper-account risk controls., responses: *okResponses}
    put: {summary: 更新 versioned paper-account risk controls., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/binding:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    put: {summary: 重新绑定 an empty paper account to a frozen stock-pool snapshot., responses: *okResponses}
  /api/product/paper/accounts/{account_id}/export:
    parameters: [{$ref: "#/components/parameters/AccountId"}]
    get: {summary: 导出 a manifested owner-safe paper-account bundle., responses: *okResponses}
  /api/product/paper/accounts/import:
    post: {summary: 验证 and import a paper-account bundle under a new owner-scoped ID., responses: *createdResponses}

  /v1/agent/sessions:
    get: {summary: 搜索并分页返回 the owner-scoped durable conversation catalog., responses: *okResponses}
    post: {summary: 创建 an owner-scoped durable conversation with private runtime correlation., responses: *createdResponses}
  /v1/agent/sessions/{session_id}:
    parameters: [{$ref: "#/components/parameters/SessionId"}]
    get: {summary: 重放 owner-scoped user messages and normalized WorkflowTrace events., responses: *okResponses}
    patch: {summary: 重命名、置顶、归档或恢复 an owner-scoped conversation., responses: *okResponses}
    delete: {summary: 归档并释放 an owner-scoped Product Agent session., responses: *noContentResponses}
  /v1/agent/sessions/{session_id}/turns:
    parameters: [{$ref: "#/components/parameters/SessionId"}]
    post: {summary: 提交 a turn to an owner-scoped Product Agent session., responses: *acceptedResponses}
  /v1/agent/sessions/{session_id}/resume:
    parameters: [{$ref: "#/components/parameters/SessionId"}]
    post: {summary: 恢复 an owner-scoped Product Agent session., responses: *okResponses}
  /v1/agent/sessions/{session_id}/cancel:
    parameters: [{$ref: "#/components/parameters/SessionId"}]
    post: {summary: 取消 an owner-scoped Product Agent turn., responses: *okResponses}
  /v1/workflows/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/LastEventId"
    get:
      summary: 流式传输 normalized BYQ WorkflowTrace events。
      responses:
        "200":
          description: Server-sent BYQ WorkflowTrace events。
          content: {text/event-stream: {schema: {type: string}}}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: byq_session
      description: 由 username/password login 建立的普通 durable browser session。
    bearerBootstrap:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 仅用于 internal/bootstrap compatibility；不是普通 browser login。
  parameters:
    EntityType: {name: entity_type, in: path, required: true, schema: {type: string, enum: [tasks, experiments, artifacts]}}
