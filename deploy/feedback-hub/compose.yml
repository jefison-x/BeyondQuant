services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: byq_feedback_hub
      POSTGRES_USER: byq_hub
      POSTGRES_PASSWORD: ${BYQ_FEEDBACK_HUB_POSTGRES_PASSWORD:?set BYQ_FEEDBACK_HUB_POSTGRES_PASSWORD}
    volumes:
      - feedback_hub_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byq_hub -d byq_feedback_hub"]
      interval: 5s
      timeout: 5s
      retries: 12

  hub:
    build:
      context: ../..
      dockerfile: services/feedback-hub/Dockerfile
    environment:
      BYQ_FEEDBACK_HUB_DATABASE_URL: postgresql+psycopg://byq_hub:${BYQ_FEEDBACK_HUB_POSTGRES_PASSWORD}@postgres:5432/byq_feedback_hub
      BYQ_FEEDBACK_HUB_ADMIN_TOKEN: ${BYQ_FEEDBACK_HUB_ADMIN_TOKEN:?set BYQ_FEEDBACK_HUB_ADMIN_TOKEN}
      BYQ_FEEDBACK_HUB_STATUS_SECRET: ${BYQ_FEEDBACK_HUB_STATUS_SECRET:?set BYQ_FEEDBACK_HUB_STATUS_SECRET}
      BYQ_FEEDBACK_PUBLISHER_TOKEN: ${BYQ_FEEDBACK_PUBLISHER_TOKEN:?set BYQ_FEEDBACK_PUBLISHER_TOKEN}
      BYQ_FEEDBACK_GITHUB_REPOSITORY: jefison-x/BeyondQuant
    ports:
      - "${BYQ_FEEDBACK_HUB_BIND:-127.0.0.1:8800}:8800"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  publisher:
    build:
      context: ../..
      dockerfile: workers/feedback-publisher/Dockerfile
    environment:
      BYQ_FEEDBACK_BACKEND_URL: http://hub:8800
      BYQ_FEEDBACK_PUBLISHER_TOKEN: ${BYQ_FEEDBACK_PUBLISHER_TOKEN:?set BYQ_FEEDBACK_PUBLISHER_TOKEN}
      BYQ_FEEDBACK_GITHUB_REPOSITORY: jefison-x/BeyondQuant
      BYQ_FEEDBACK_GITHUB_TOKEN: ${BYQ_FEEDBACK_GITHUB_TOKEN:-}
      BYQ_FEEDBACK_GITHUB_APP_ID: ${BYQ_FEEDBACK_GITHUB_APP_ID:-}
      BYQ_FEEDBACK_GITHUB_INSTALLATION_ID: ${BYQ_FEEDBACK_GITHUB_INSTALLATION_ID:-}
      BYQ_FEEDBACK_GITHUB_APP_PRIVATE_KEY_FILE: ${BYQ_FEEDBACK_GITHUB_APP_PRIVATE_KEY_FILE:-}
      BYQ_FEEDBACK_POLL_SECONDS: ${BYQ_FEEDBACK_POLL_SECONDS:-10}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  feedback_hub_postgres:
