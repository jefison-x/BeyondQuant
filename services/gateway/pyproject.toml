[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "byq-gateway"
version = "0.1.0"
description = "Minimal BeyondQuant Gateway bootstrap"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
