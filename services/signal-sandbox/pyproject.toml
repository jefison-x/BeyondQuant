[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "byq-signal-sandbox"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.3.post1",
  "six==1.17.0",
  "tzdata==2026.3",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools]
py-modules = ["server", "runner"]
