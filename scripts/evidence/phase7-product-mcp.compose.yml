# Explicit test-only overlay for a uniquely named disposable Phase 7 project.
# Supply generated secrets and unique BYQ_* volume/network names via --env-file.
services:
  postgres:
    restart: "no"
  backend:
    restart: "no"
  mcp:
    restart: "no"
  mcp-observer:
    image: python:3.13-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
    command: ["python3", "/probe/phase7_product_mcp_observer.py"]
    restart: "no"
    environment:
      BYQ_PHASE7_MCP_OBSERVER: "1"
    volumes:
      - ./services/runtime-adapter/tests:/probe:ro
    networks:
      - byq_product
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8350/_phase7/observed', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  runtime-adapter:
    restart: "no"
    command: ["python3", "/probe/phase7_compose_child_probe.py"]
    environment:
      BYQ_PHASE7_CHILD_PROBE: "1"
      BYQ_PHASE7_PRODUCT_MCP_OBSERVER_URL: http://mcp-observer:8350/mcp/v1
      BYQ_DSH_SUBAGENT_TIMEOUT_SECONDS: "120"
      BYQ_DSH_NO_PROGRESS_TIMEOUT_SECONDS: "120"
    volumes:
      - ./services/runtime-adapter/tests:/probe:ro
    depends_on:
      mcp:
        condition: service_healthy
      backend:
        condition: service_healthy
      mcp-observer:
        condition: service_healthy
  gateway:
    restart: "no"
    ports: !reset []
