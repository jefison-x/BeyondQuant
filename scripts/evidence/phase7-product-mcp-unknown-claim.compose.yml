# Test-only overrides. Use with compose.yml, compose.override.yml and
# phase7-product-mcp.compose.yml in one uniquely named disposable project.
services:
  backend:
    restart: "no"
    command: ["python3", "/probe/phase7_compose_unknown_claim_backend.py"]
    environment:
      BYQ_PHASE7_UNKNOWN_CLAIM_BACKEND: "1"
    volumes:
      - ./services/backend/tests:/probe:ro
  runtime-adapter:
    restart: "no"
    command: ["python3", "/probe/phase7_compose_unknown_claim_probe.py"]
    environment:
      BYQ_PHASE7_UNKNOWN_CLAIM_PROBE: "1"
      BYQ_MCP_URL: http://mcp-observer:8350/mcp/v1
      BYQ_DSH_SUBAGENT_TIMEOUT_SECONDS: "120"
      BYQ_DSH_NO_PROGRESS_TIMEOUT_SECONDS: "120"
    volumes:
      - ./services/runtime-adapter/tests:/probe:ro
  gateway:
    restart: "no"
    ports: !reset []
