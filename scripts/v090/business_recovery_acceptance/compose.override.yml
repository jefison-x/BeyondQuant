services:
  runtime-adapter:
    image: byq-v090-recovery-runtime-adapter:latest
    ports:
      - "127.0.0.1:18400:8400"
    volumes:
      - type: bind
        source: ${BYQ_ACCEPTANCE_ROOT}/services/runtime-adapter/tests
        target: /app/tests
        read_only: true
    command: ["python3", "-m", "tests.v090_br_acceptance_provider"]
    environment:
      BYQ_F6_EXECUTOR_ENABLED: "1"
      BYQ_V090_BR_ACCEPTANCE: "1"
      BYQ_V090_BR_MODE_FILE: "/var/lib/byq/dsh-sessions/__acceptance_mode"
      DEEPSEEK_API_KEY: "acceptance-synthetic-only"
      BYQ_DSH_COMPATIBILITY_RELEASE: "dsh-0.1.2rc1"
      BYQ_DSH_PROCESS_OWNERSHIP: "root-turn"
      BYQ_DSH_COMPOSITION: "/opt/byq/profiles/byq-product.patch.yml"
      BYQ_DSH_COMPOSITION_IDENTITY: "/opt/byq/profiles/byq-product.identity.json"
      DSH_SESSION_ROOT: "/var/lib/byq/dsh-sessions/f6-qualification"
  gateway:
    ports:
      - "127.0.0.1:18100:8100"
    environment:
      BYQ_F6_EXECUTOR_ENABLED: "1"
  backend:
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      BYQ_F6_EXECUTOR_ENABLED: "1"
